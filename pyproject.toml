[project]
name = "xat-practice"
version = "0.1.0"
description = "XAT 2026 training from foundation to mock: items are gated, keys are recomputed, difficulty is derived"
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.13",      # THE KEY IS RE-DERIVED BY COMPUTATION. solver.py is the
                        # reason a percent claim is a statement about code and
                        # not about a model's opinion (AGENTS.md, D1).
    "pydantic>=2.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
xat-practice = "xat_practice.cli:main"

# MEASURED 2026-10-02, and this is not a style preference. `uv sync` PRUNES: any
# package in .venv that is not declared here is REMOVED. Before this group
# existed, `uv sync` deleted mypy, pytest, pytest-cov and ruff -- the four tools
# the gate commands are run with. Demonstrated in a scratch project:
# `uv sync` printed `- requests==2.34.2` and the next import raised
# ModuleNotFoundError. The README's `uv pip install` had been working only
# because it bypasses pruning, which is luck, not a design.
#
# So the dev tools are DECLARED. `uv sync` is now the correct install, and
# `uv run mypy src` is safe.
[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# `--cov` belongs in addopts, NOT only in the coverage command. If it is absent
# here, `pytest -q` writes NO coverage data and the coverage command then
# reports whatever `.coverage` happens to be on disk -- possibly hours stale --
# and reports it as a fresh measurement. That defect is the reference project's
# F1 and it was quoted as current by two separate sessions. It ships in the
# FIRST COMMIT. Do not remove it to speed the suite up.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src/xat_practice --cov-report=term-missing"

# `pythonpath = ["."]` is NOT a convenience. It makes the suite pass under BOTH
# `pytest` and `python -m pytest`.
#
# MEASURED 2026-10-02: `pytest` failed 7 tests with `ModuleNotFoundError: No
# module named 'tests'` and `python -m pytest` passed all 292. Same interpreter,
# same venv, same code -- the only difference is that `-m` puts the CWD on
# `sys.path[0]` and the console script does not. `tests/test_api.py` and
# `tests/test_lesson1.py` do `from tests.test_gates import at_level`, which needs
# the project root importable, and `tests/` has no `__init__.py`.
#
# It went unnoticed because EVERY documented command used `python -m pytest`. So
# the suite had only ever been run in one of its two legal forms, and a reader who
# typed the shorter one got 7 failures that look like a broken checkout. Do not
# remove this in favour of adding `tests/__init__.py`: the `python -m` form is the
# one that hides the dependency, and this line is what makes the short form honest.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/xat_practice"]

[tool.coverage.report]
precision = 2
[[tool.mypy.overrides]]
module = ["sympy.*"]
ignore_missing_imports = true
