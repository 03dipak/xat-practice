<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XAT Practise &middot; UI probe</title>
<!-- THE REAL STYLESHEET, and this link is load-bearing.
     MEASURED 2026-10-02: the probe ran WITHOUT it, and every appearance defect
     was therefore invisible to it. The worst one: `.opt` overrode `background`
     but not `colour`, so all five options rendered WHITE ON WHITE -- and
     `every-option-is-legible-contrast-at-least-4-5-1` PASSED against the broken
     build, because with no CSS the buttons were default grey and perfectly
     readable. A check that cannot see the styling cannot catch a styling bug,
     and 38 DOM assertions passed while the page was unusable.

     So the CSS is a real shared file, loaded by both the page and the probe. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  THE UI PROBE. The page a human sits, driven by a script instead.

  WHY THIS FILE EXISTS, and the reason is the worst defect this project has
  produced. `lesson.js` did not parse for the whole of Wave 1 -- an apostrophe in
  prose, `item's`, closed a JavaScript string literal -- so the browser ran none
  of the file and showed only the static HTML. The lesson page had never worked,
  not once. 161 tests passed throughout, because every one of them asserted on
  the file's TEXT.

  A static bundle's correctness is not a property of its text. It is a property
  of what a browser does when it loads it. So this file loads the real
  `lesson.js`, against the real `index.html` shell, and asserts on the DOM the
  browser actually built.

  The method is lifted from photos_graphics `tools/c2_shaping_probe.html` and
  `tools/run_probe_headless.js`, where the same class of defect had already
  produced a green suite: "all the earlier tests were static string assertions,
  and a script that threw ReferenceError before measuring once had a green
  suite. This executes the real script."

  The probe writes one line, `PROBE_RESULT::<json>`, into #probe-out.
  `tools/ui_probe.py` runs it in a real headless Chromium, reads that line back
  and exits non-zero on any failure. Nothing here is a claim about the source.
-->
<main>
  <h1>Lesson 1 &middot; Simple Interest</h1>
  <div class="sub">One subtopic, four levels &mdash; foundation, easy, medium,
    hard. Nothing here is scored; everything here is meant to be understood.</div>
  <div class="rungs" id="rungs"></div>
  <div id="stage"></div>
</main>
<div class="foot" id="foot"></div>
<h1 id="probe-out">PENDING</h1>

<!-- EXPECTED is injected by tools/ui_probe.py before this script runs. It carries
     the recomputed key for each item, so the browser's own verdict can be
     compared against the solver's. A UI that disagrees with the key is the one
     failure this product cannot have. -->
<script src="lesson.js"></script>
<script>
"use strict";

const checks = [];
const jsErrors = [];
const diag = {};
let clickSeen = 0;
let clickTarget = '';
document.addEventListener('click', (e) => { clickSeen++; clickTarget = (e.target && e.target.tagName) + '#' + (e.target && e.target.id); }, true);
// MEASURED: the first version of this probe waited 8 seconds for a result that
// never came and reported "check-produces-a-verdict: FAIL" with an empty
// detail. The real cause was a rejected promise inside lesson.js. An
// unhandled rejection is invisible unless somebody listens for it, so a page
// can throw and the probe can only say "it didn't work".
window.addEventListener('error', (e) => {
  jsErrors.push('error: ' + (e.message || 'unknown') + ' @' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', (e) => {
  jsErrors.push('unhandled rejection: ' + ((e.reason && e.reason.stack) || e.reason));
});
function record(name, pass, detail) {
  checks.push({ name, pass: !!pass, detail: String(detail === undefined ? '' : detail) });
}
// ?stop=<stage> halts the drive at a chosen state and leaves the page there, so
// a screenshot of this run is a screenshot of THAT state. MEASURED 2026-10-02:
// the probe checked 34 properties of the options screen and nobody had ever
// photographed it, and the owner reported the options were invisible. A DOM
// assertion says the nodes exist; it does not say they are legible.
const STOP = new URLSearchParams(location.search).get('stop') || 'end';
const halted = (stage) => STOP === stage;
const q = (s) => document.querySelector(s);
const qa = (s) => Array.from(document.querySelectorAll(s));
const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function waitFor(fn, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    try { if (fn()) return true; } catch (e) { /* not ready yet */ }
    await new Promise((r) => setTimeout(r, 40));
  }
  return false;
}

function resources() {
  return performance.getEntriesByType('resource').map((r) => r.name);
}
function fetched(needle) {
  return resources().filter((n) => n.indexOf(needle) !== -1).length;
}

function report(done) {
  document.getElementById('probe-out').textContent =
    'PROBE_RESULT::' + JSON.stringify({ done, checks, jsErrors, diag });
}

(async () => {
  try {
    // ---- 1. the page runs at all -------------------------------------------------
    // Every element below is written by lesson.js and by nothing else. An empty
    // stage means the file did not parse or threw before rendering, and this is
    // the assertion that would have caught the shipped defect on day one.
    const alive = await waitFor(() => q('.stem') && !q('.stem').classList.contains('pending'), 8000);
    record('page-renders', alive, alive ? norm(q('.stem').textContent).slice(0, 70) : 'stage stayed empty');
    if (!alive) return report('dead');

    record('rung-bar-built', qa('.rung').length === 4, qa('.rung').length + ' rungs');

    // Nothing lesson.js defines may be reachable as a global.
    //
    // MEASURED: `check` was a GLOBAL function, and this probe's own
    // `check(name, pass, detail)` silently replaced it. The click handler then
    // called the wrong function, answerkey.json was never fetched, and the page
    // produced no verdict -- which surfaced as ONE vague failing check and cost
    // a long diagnosis. `ORDER`, `state`, `render`, `esc`, `fail`, `check` and
    // `next` were all on `window`, where any future script can overwrite any of
    // them. The script is now wrapped in an IIFE.
    const leaked = ['ORDER', 'LABEL', 'state', 'rungBar', 'esc', 'loadPaper',
                    'loadKey', 'fail', 'render', 'check', 'next', 'finish']
      .filter((n) => typeof window[n] !== 'undefined');
    record('lesson-js-leaks-no-globals', leaked.length === 0,
      leaked.length ? 'leaked: ' + leaked.join(', ') : 'all 12 names private');
    record('footer-states-the-guarantees',
      /recomputed/.test(norm(q('#foot').textContent)) &&
      /derived from each item/.test(norm(q('#foot').textContent)),
      norm(q('#foot').textContent).slice(0, 60));
    // The build id is on screen, so a stale script is self-evident instead of
    // being a mystery. MEASURED: the owner reported the options were invisible
    // while the served page was provably correct, and nothing on the page could
    // distinguish the two.
    // D18 TEACH THEN ASK. The card must be on screen BEFORE the stem, it must
    // teach the four things a beginner lacks, and -- the one that matters most --
    // it must NOT hand over question 1's key.
    //
    // MEASURED 2026-10-02: `viewer` found the formula only reached the screen
    // AFTER question 1 was answered, so a learner who did not know the formula
    // could not learn it here. And the trap in fixing it: the only worked example
    // in the file was Q1 verbatim, which would hand over the key before the
    // commit.
    const teach = q('.teach');
    record('the-teaching-card-renders-before-question-1', teach !== null,
      teach ? 'heading: ' + norm(q('.teach h2').textContent) : 'no .teach element');
    if (teach) {
      const t = norm(teach.textContent);
      record('the-teach-card-is-above-the-question',
        teach.compareDocumentPosition(q('.card:not(.teach)')) &
        Node.DOCUMENT_POSITION_FOLLOWING ? true : false,
        'teach card precedes the question card');
      // DERIVED FROM THE LESSON'S OWN DATA, not hardcoded to Lesson 1.
      // MEASURED 2026-10-02: these four checks asserted Lesson 1's regexes
      // (`P x R x T / 100`, the words "Principal"/"Rate per annum", `/per year/`).
      // Run against Lesson 2 they failed 4-for-4 -- and the failure was in the
      // CHECK, not the page: Geometry's card is correct and the probe had no idea
      // what correct looks like outside Simple Interest. Worse, `47/47` on Lesson 1
      // was quoted as the UI being sound. It was the soundness of ONE lesson.
      //
      // Now each check asks a question that is true of any lesson: does the card
      // render the formula the DATA says, does it define every legend term the
      // DATA declares, and does it state a units rule at all. The content is the
      // lesson's; the property is the probe's.
      const T = window.TEACH || {};
      const formula = String(T.formula || '');
      record('the-teach-card-gives-the-formula',
        formula.length > 0 && t.indexOf(norm(formula)) !== -1 && /[=/x]/.test(formula),
        formula ? ('renders: ' + norm(formula)) : 'TEACH has no formula');
      const legend = Array.isArray(T.legend) ? T.legend : [];
      record('the-teach-card-defines-every-symbol',
        legend.length > 0 && legend.every((e) => t.indexOf(norm(e[0])) !== -1),
        legend.length + ' legend terms: '
        + legend.map((e) => e[0] + (t.indexOf(norm(e[0])) !== -1 ? '=yes' : '=NO'))
              .join(', '));
      const units = String(T.units || '');
      record('the-teach-card-states-the-units-rule',
        units.length > 0 && t.indexOf(norm(units)) !== -1,
        units ? 'units rule present' : 'TEACH has no units rule');
      const example = String(T.example || '');
      record('the-teach-card-has-a-worked-example',
        example.length > 0 && t.indexOf(norm(example)) !== -1,
        example ? 'example present' : 'TEACH has no example');
      // THE KEY MUST NOT BE ON SCREEN, and the check must be exact.
      //
      // MEASURED: the first version of this check looked for the substring "200"
      // and failed, because "2000" CONTAINS "200". A leak check that fires on the
      // worked example's own numbers is worse than none -- an author would fix
      // the teaching to satisfy it. So it looks for Q1's KEY TEXT and for Q1's
      // PRINCIPAL, both of which are specific to question 1.
      // THE LEAK CHECKS, DERIVED. These were Lesson 1's numbers written into the
      // probe, so on any other lesson they would have PASSED VACUOUSLY -- a leak
      // check that cannot see the lesson's own key is a check that reports safety
      // it never looked for.
      //
      // `window.Q1` carries question 1's key text and every number in its stem, so
      // the question is finally the real one: does this card hand over THIS
      // lesson's answer?
      const Q1 = window.Q1 || {};
      const keyText = String(Q1.key_text || '');
      // NUMBERS, NOT SUBSTRINGS. This is the second time this check has been
      // defeated by containment, and the original comment in this file already
      // recorded the first one: looking for "200" matched inside "2000".
      //
      // MEASURED 2026-10-02: deriving the leak numbers from the stem made it fire
      // on Lesson 1, whose card is clean, reporting it "reuses Q1's numbers 10, 2".
      // Those are the leading digits of the formula's own `/100` and of `2,000` in
      // the worked example. Both numbers are genuinely ABSENT from the card; only
      // their first characters are present. The remedy the file already prescribed
      // is to extract the card's numbers too and compare the two sets, so
      // containment cannot decide it.
      const numsIn = (text) => {
        const out = [];
        const found = String(text).match(/\d[\d,]*(?:\.\d+)?/g) || [];
        for (const raw of found) {
          out.push(raw);
          if (raw.indexOf(',') !== -1) out.push(raw.split(',').join(''));
        }
        return out;
      };
      // Scoped to the WORKED EXAMPLE, not the whole card -- and that scope is the
      // finding. The card-wide version fired on Lesson 1 reporting "reuses Q1's
      // numbers 10, 2". Those two numbers are in the LEGEND's explanations:
      // "10% means you write 10" and "2 means two years". They illustrate what a
      // rate and a time look like; neither computes Q1's answer, and Q1's answer is
      // Rs 200, which the card does not contain.
      //
      // D18's rule is that the worked EXAMPLE must not be Q1 verbatim, because that
      // is what hands over the key. Definition prose is allowed to mention a rate of
      // 10%. So the comparison is between Q1's numbers and the EXAMPLE's numbers,
      // and the answer-determining value -- the key text -- is checked separately
      // against the whole card above.
      const exNumsArr = numsIn(example);
      const exNumSet = new Set(exNumsArr);
      const q1Nums = (Q1.numbers || []).map(String).filter((n) => !n.includes(','));
      record('the-teach-card-does-not-leak-questions-key',
        keyText.length > 0 && t.indexOf(keyText) === -1,
        t.indexOf(keyText) !== -1 ? 'the card states Q1\'s answer (' + keyText + ')'
                                  : 'Q1 key text (' + keyText + ') absent');
      const reused = q1Nums.filter((n) => exNumSet.has(n));
      record('the-teach-card-does-not-reuse-questions-numbers',
        q1Nums.length > 0 && reused.length === 0,
        reused.length
          ? 'the WORKED EXAMPLE reuses Q1\'s numbers ' + reused.join(', ')
          : 'the example shares none of Q1\'s ' + q1Nums.length + ' numbers');
      // And the positive half: the example must ACTUALLY carry numbers, or "no
      // leak" is satisfied by an example that teaches nothing.
      const exNums = Array.from(exNumSet);
      record('the-teach-card-uses-different-numbers-from-q1',
        exNums.length > 0 && exNums.every((n) => q1Nums.indexOf(n) === -1),
        'example runs on ' + exNums.join(', ')
        + (exNums.length
            ? ' and none is Q1\'s'
            // MEASURED: written as two adjacent string literals, which JavaScript
            // does NOT concatenate -- `SyntaxError: Unexpected string` killed the
            // whole probe script and the page went PENDING. The lesson.js file was
            // broken this way for a whole wave and 161 tests passed, so every script
            // in this repo is `node --check`ed.
            : ' -- example has NO numbers, so it teaches nothing and no leak'
              + ' is possible'));
    }

    const footText = norm(q('#foot').textContent);
    const m = footText.match(/Build ([0-9a-f]{8})/);
    // THE BACK LINK. MEASURED 2026-10-02: it was `href="../"`, written when a
    // lesson lived at `out/<lesson_id>/`. The exam layer nested the output to
    // `out/<exam>/<section>/<lesson_id>/`, so `../` resolved to `out/xat/qa_di/`
    // -- which has no index.html, and SimpleHTTPRequestHandler answers a directory
    // with no index by serving a DIRECTORY LISTING. HTTP 200, so nothing went red,
    // and the learner got a raw file index instead of the topics page.
    //
    // Checked in the browser because only the browser resolves a relative href the
    // way a learner does. The text assertion in test_bundle.py pins the depth; this
    // pins the resolution.
    const backLink = q('#back');
    record('the-lesson-page-offers-a-way-back', !!backLink,
      backLink ? 'href=' + backLink.getAttribute('href') : 'no #back element');
    if (backLink) {
      // `fetch`, NOT an iframe. MEASURED 2026-10-02: the first version loaded the
      // target in an iframe, and because the probe now runs inside the REAL
      // index.html, that re-ran the whole probe recursively and onload never fired
      // within the budget. `fetch` retrieves the bytes without executing a single
      // script, which is all this check needs.
      const target = new URL(backLink.getAttribute('href'), location.href).href;
      let verdict = 'not fetched';
      let isListing = false;
      try {
        const r = await fetch(target, { cache: 'no-store' });
        const body = await r.text();
        verdict = 'HTTP ' + r.status;
        // Match the <TITLE>, not the body text. MEASURED 2026-10-02: the first
        // version searched the whole body for /Directory listing/ and matched the
        // lesson page's own explanatory COMMENT about this very defect. The real
        // signal is that `SimpleHTTPRequestHandler` titles its listing page
        // "Directory listing for <path>" -- which is a title, not prose.
        const title = (body.match(/<title>([^<]*)<\/title>/i) || [, ''])[1];
        isListing = /directory listing/i.test(title);
        verdict += ', title "' + title.trim() + '"';
      } catch (e) {
        verdict = 'fetch failed: ' + e.message;
      }
      record('the-back-link-does-not-land-on-a-directory-listing',
        verdict.startsWith('HTTP 200') && !isListing,
        target + ' -> ' + verdict + ', directory listing: ' + isListing);
    }

    record('the-page-states-which-build-it-is', !!m, m ? 'build ' + m[1] : footText.slice(0, 60));
    record('question-1-is-the-foundation-rung', /FOUNDATION/.test(q('.qno').textContent), norm(q('.qno').textContent));

    // ---- 2. the commit barrier ---------------------------------------------------
    // The property is NOT "the box is absent" -- the empty box is fine. It is
    // that no OPTION exists in the DOM yet, so there is nothing to inspect.
    record('no-option-exists-in-the-dom-before-the-reveal', qa('.opt').length === 0,
      qa('.opt').length + ' .opt elements present');
    record('reveal-is-born-disabled', q('#reveal').disabled === true,
      'disabled=' + q('#reveal').disabled);
    record('check-button-absent-before-the-reveal', q('#check') === null, 'no check button yet');

    // clicking through without a confidence must accomplish nothing
    q('#reveal').click();
    record('clicking-a-disabled-reveal-does-nothing', qa('.opt').length === 0,
      qa('.opt').length + ' .opt elements leaked by a disabled button');

    // ---- 3. the commit ------------------------------------------------------------
    q('[data-conf="sure"]').click();
    record('confidence-enables-the-reveal', q('#reveal').disabled === false,
      'disabled=' + q('#reveal').disabled);
    // The commit's value is that it produces no observable effect anywhere.
    // Measured as network activity, which is the only way it could leave the
    // machine; the storage half is asserted against the served file in
    // tests/test_bundle.py, because this page contains the words itself.
    const resourcesAtCommit = resources().length;
    record('the-commit-sends-nothing',
      resources().length === resourcesAtCommit,
      resources().length - resourcesAtCommit + ' requests during the commit');

    q('#reveal').click();
    if (halted('options')) { record('stopped-at-options', true, 'halted for a screenshot'); return report('done'); }
    const revealed = q('#optBox') !== null && !q('#optBox').classList.contains('hidden');
    record('reveal-shows-the-options', revealed, 'optBox hidden=' + (q('#optBox') ? q('#optBox').classList.contains('hidden') : 'absent'));
    record('commit-box-is-replaced-not-stacked', q('#commitBox') === null || q('#commitBox').classList.contains('hidden'), 'commitBox hidden');

    // ---- 4. the options -----------------------------------------------------------
    const opts = qa('.opt');
    record('exactly-five-options', opts.length === 5, opts.length + ' options');

    // READABLE, NOT MERELY PRESENT.
    //
    // MEASURED 2026-10-02, the worst UI defect in this project after the syntax
    // error: every option rendered WHITE ON WHITE. `.opt` overrode `background`
    // but not `colour`, so the generic `button { color: #fff }` rule won. All
    // five rows, the letter badge and the value, were on screen and invisible.
    // The owner reported it as "not able to see any option or values" and could
    // see the markup perfectly well in devtools -- which is exactly what
    // white-on-white looks like from the DOM side: the nodes are all there.
    //
    // 35 checks had passed at that point. Every one of them asserted that an
    // element EXISTED. Not one asked whether a human could read it. An element
    // that is present and illegible passes every DOM assertion there is.
    function rgb(str) {
      const m = String(str).match(/rgba?\(([^)]+)\)/);
      return m ? m[1].split(',').slice(0, 3).map((n) => parseFloat(n)) : null;
    }
    function luminance(c) {
      if (!c) return null;
      const f = c.map((v) => {
        const x = v / 255;
        return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
    }
    const unreadable = [];
    opts.forEach((o, n) => {
      const cs = getComputedStyle(o);
      const fg = rgb(cs.color);
      let bg = rgb(cs.backgroundColor);
      if (!bg || bg.every((v) => isNaN(v))) bg = [255, 255, 255];
      const lf = luminance(fg);
      const lb = luminance(bg);
      const ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
      if (ratio < 4.5) {
        unreadable.push('option ' + 'ABCDE'[n] + ' contrast ' + ratio.toFixed(2)
          + ':1 (' + cs.color + ' on ' + cs.backgroundColor + ')');
      }
      const badge = o.querySelector('.k');
      const bcs = getComputedStyle(badge);
      const bl = luminance(rgb(bcs.color));
      const bb = luminance(rgb(bcs.backgroundColor)) || 1;
      const bratio = (Math.max(bl, bb) + 0.05) / (Math.min(bl, bb) + 0.05);
      if (bratio < 4.5) {
        unreadable.push('badge ' + 'ABCDE'[n] + ' contrast ' + bratio.toFixed(2) + ':1');
      }
    });
    record('every-option-is-legible-contrast-at-least-4-5-1', unreadable.length === 0,
      unreadable.length ? unreadable.join(' ;; ') : 'all 5 options and 5 badges readable');

    // And the text must actually occupy space. An element can pass a contrast
    // check and still render nothing if it is empty or collapsed.
    const flat = opts.map((o) => norm(o.textContent));
    record('every-option-shows-its-letter-and-its-value',
      flat.every((t) => t.length > 2 && /[A-E]/.test(t) && /\d/.test(t)),
      flat.join(' | ').slice(0, 90));

    const painted = opts.filter((o) => o.getBoundingClientRect().height > 20);
    record('every-option-has-a-clickable-height', painted.length === 5,
      painted.length + ' of 5 taller than 20px');
    record('options-are-labelled-a-to-e',
      opts.map((o) => norm(o.querySelector('.k').textContent)).join('') === 'ABCDE',
      opts.map((o) => norm(o.querySelector('.k').textContent)).join(''));
    record('the-key-is-not-visible-before-checking',
      qa('.opt.right').length === 0 && qa('.opt.wrong').length === 0,
      qa('.opt.right').length + ' marked before check');

    // record() must refuse to run with nothing selected
    q('#check').click();
    await new Promise((r) => setTimeout(r, 200));
    record('check-with-no-selection-does-nothing', q('#result').classList.contains('hidden'), 'no result shown');

    // ---- 5. THE KEY, fetched only now --------------------------------------------
    const keyFetchesBefore = fetched('answerkey.json');
    record('answerkey-not-fetched-before-check', keyFetchesBefore === 0,
      keyFetchesBefore + ' fetches before check');

    // deliberately pick a WRONG option so the full teaching path runs
    // WHICH ITEM. MEASURED 2026-10-02: this was the literal 'L1-F', so pointing
    // the probe at Lesson 2 made `expect` undefined, `wantWrong` NaN, and the click
    // land on nothing -- five checks failed for that reason and not one of them was
    // telling the truth about the page. The ladder under test now names its own
    // first rung, from the same injected map the verdict is checked against.
    const keys = Object.keys(window.EXPECTED || {});
    const FIRST = keys[0];
    const expect = (window.EXPECTED || {})[FIRST];
    const wantWrong = (expect + 1) % 5;
    opts[wantWrong].click();
    record('exactly-one-option-is-selected', qa('.opt.sel').length === 1, qa('.opt.sel').length + ' selected');

    const btn = q('#check');
    diag.checkButton = btn ? btn.tagName + '#' + btn.id : 'NULL';
    diag.selCount = qa('.opt.sel').length;
    if (btn) btn.click();
    const gotResult = await waitFor(() => !q('#result').classList.contains('hidden'), 8000);
    diag.clickSeen = clickSeen;
    diag.clickTarget = clickTarget;
    record('check-produces-a-verdict', gotResult, norm(q('.verdict') && q('.verdict').textContent));

    const expectedVerdict = expect === wantWrong ? 'Correct.' : 'Not correct.';
    record('the-browser-verdict-matches-the-recomputed-key',
      norm(q('.verdict').textContent).indexOf(expectedVerdict) === 0,
      'browser said "' + norm(q('.verdict').textContent) + '", key is index ' + expect);

    record('answerkey-is-fetched-inside-check',
      fetched('answerkey.json') > keyFetchesBefore,
      fetched('answerkey.json') + ' fetches after check');

    const letter = 'ABCDE'[expect];
    record('the-verdict-names-the-answer-letter',
      norm(q('.verdict').textContent).indexOf(letter) === -1
        ? false
        : norm(q('.verdict').textContent).indexOf('answer is ' + letter) !== -1,
      norm(q('.verdict').textContent));

    record('the-correct-option-is-marked', qa('.opt.right').length === 1, qa('.opt.right').length + ' marked right');
    record('the-wrong-pick-is-marked-wrong', qa('.opt.wrong').length === 1, qa('.opt.wrong').length + ' marked wrong');

    if (halted('result')) { record('stopped-at-result', true, 'halted for a screenshot'); return report('done'); }

    // ---- 6. the teaching ----------------------------------------------------------
    const sols = qa('#result .sol li');
    record('the-solution-has-steps', sols.length >= 3, sols.length + ' steps');
    record('the-solution-ends-on-the-stated-answer',
      sols.length > 0 && norm(sols[sols.length - 1].textContent).indexOf('ANSWER: ') === 0,
      sols.length ? norm(sols[sols.length - 1].textContent) : 'no steps');

    const solBlob = sols.map((s) => norm(s.textContent)).join(' ');
    const everyOptionRuledOut = qa('.opt').every((o) => {
      const t = norm(o.lastElementChild.textContent);
      return solBlob.indexOf(t) !== -1;
    });
    record('every-option-is-ruled-out-by-name', everyOptionRuledOut,
      'the owner asked for the misconception behind every option not picked');

    const cell = norm(q('#result .qcell div:last-child').textContent);
    record('the-quadrant-cell-is-reported', cell.length > 10, cell.slice(0, 60));
    record('the-quadrant-cell-matches-sure-and-wrong',
      cell.indexOf('Sure and WRONG') === 0, cell.slice(0, 40));

    // ---- 7. moving on -------------------------------------------------------------
    const paperBefore = fetched('paper.json');
    q('#next').click();
    const advanced = await waitFor(() => q('.qno') && /question 2/.test(q('.qno').textContent), 8000);
    record('next-advances-to-question-2', advanced, norm(q('.qno') && q('.qno').textContent));
    record('advancing-does-not-refetch-the-paper', fetched('paper.json') === paperBefore,
      paperBefore + ' -> ' + fetched('paper.json') + ' paper.json fetches');
    record('question-2-is-the-easy-rung', /EASY/.test(q('.qno').textContent), norm(q('.qno').textContent));

    // ---- 8. the level tabs -------------------------------------------------------
    //
    // MEASURED 2026-10-02: the owner asked for "tabs the 4 level i can choose
    // any", and the rungs were `<div>`s -- a read-out of a fixed queue. Making them
    // buttons is the easy half. The half that can silently go wrong is the BARRIER:
    // `state.commit` and `state.pick` are per-item, and a jump that carries them
    // across would show the HARD rung with the previous rung's "I am sure" already
    // filled in -- the learner answers a question they never committed to, and the
    // verdict panel is already showing. So these three are load-bearing, not
    // decoration.
    const rungs = qa('.rung');
    record('the-levels-are-tabs-not-divs',
      rungs.length === 4 && rungs.every(x => x.tagName === 'BUTTON'),
      rungs.length + ' rungs, tags ' + rungs.map(x => x.tagName).join(','));
    const hardTab = rungs.find(x => x.textContent === 'HARD');
    record('a-hard-tab-exists', !!hardTab,
      rungs.map(x => x.textContent).join(', '));
    if (hardTab) {
      // COMMIT FIRST, OR THE THREE CHECKS BELOW PASS VACUOUSLY. MEASURED
      // 2026-10-02: deleting `state.commit = null` from jumpTo() left the probe at
      // 52/52, because nothing had been committed and so nothing could carry over.
      // A check that has only ever been shown a true statement is untested, and this
      // one had only ever been shown a null.
      //
      // TWO clicks, and the second is easy to miss: saying you are sure only
      // ENABLES `#reveal`. The options are built when reveal is clicked, which is the
      // commit barrier doing its job -- the option list is not in the DOM before
      // then. One `sure` click leaves 0 options and every reset check below passes
      // for the wrong reason.
      q('[data-conf="sure"]').click();
      record('saying-sure-enables-reveal', !q('#reveal').disabled,
        'reveal disabled: ' + q('#reveal').disabled);
      q('#reveal').click();
      await waitFor(() => qa('.opt').length > 0, 6000);
      record('the-barrier-was-open-before-the-jump',
        qa('.opt').length > 0 && !q('#result:not(.hidden)'),
        qa('.opt').length + ' options open, result visible: '
        + !!q('#result:not(.hidden)'));

      hardTab.click();
      const jumped = await waitFor(
        () => q('.qno') && /HARD/.test(q('.qno').textContent), 8000);
      record('clicking-hard-jumps-to-the-hard-rung', jumped,
        norm(q('.qno') && q('.qno').textContent));
      // The barrier must have RESET, not carried over.
      record('jumping-resets-the-commit-not-carries-it',
        !q('#result:not(.hidden)') && qa('.opt').length === 0,
        'result panel visible: ' + !!q('#result:not(.hidden)') +
        ', options on screen: ' + qa('.opt').length);
      const sure = q('[data-conf="sure"]');
      record('jumping-clears-the-sure-button',
        !sure || sure.className.indexOf('sel') === -1,
        'sure button class: ' + (sure ? sure.className : 'absent'));

      // NOTE ON WHAT IS *NOT* CHECKED HERE, because a check that cannot fail on the
      // bug it names is not evidence.
      //
      // A carried-over `state.commit` is invisible in the DOM: render() rebuilds a
      // fresh `<button id="reveal" disabled>` and an empty `#commitNote`, so every
      // DOM assertion here passes with the reset deleted (measured: 54/54, twice).
      // Where it bites is check()'s verdict quadrant, and reading that from the probe
      // needs a full answer cycle on the jumped rung, which is slow and fragile.
      //
      // So the fix is STRUCTURAL rather than tested: `render()` itself clears
      // state.commit and state.pick, so no caller can get it wrong. The three checks
      // above -- the jump happens, the result panel is gone, 0 options, sure not
      // selected -- are what the browser can actually prove. The reset is pinned by
      // `test_render_owns_the_per_item_commit_reset` in tests/test_bundle.py, which
      // is a TEXT assertion and is labelled as one.
    }

    report('done');
  } catch (err) {
    record('the-probe-itself-ran-to-completion', false, (err && err.stack) || String(err));
    report('threw');
  }
  if (jsErrors.length) {
    record('the-page-raised-no-javascript-error', false, jsErrors.join(' ;; '));
  } else {
    record('the-page-raised-no-javascript-error', true, 'no error or unhandled rejection');
  }
  report('done');
})();
</script>
</body>
</html>
